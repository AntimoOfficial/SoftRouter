<h1>配置助手已安装</h1>
<p>打开「应用程序 → Air Gateway」。</p><ol><li>点击「部署指南」，让 AI 为目标 Mac 准备闲置下游接口，并生成 gateway.conf。</li><li>导入配置，核对设备与地址，然后点击「安装网关」。</li><li>管理员密码只在 macOS 授权提示中输入。</li><li>确认状态为 RUNNING 后接到路由器 WAN，设置 WAN 和 DNS，再用下游设备测试网页。</li></ol>
<p>已有网关不会自动迁移。安装应用成功不代表网关已启用，也不代表下游已经联网。</p></html>
