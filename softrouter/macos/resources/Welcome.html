<h1>SoftRouter</h1><p>把一台 Mac 的 Wi-Fi 上游共享给有线路由器。</p>
<p>这个安装包将配置助手放入「应用程序」文件夹。安装应用本身不会启用网络转发；首次打开后，导入 AI 按部署指南生成的本机配置，再通过系统管理员授权安装网关。</p>
<p>需要 macOS 14 或更高版本、独立以太网接口，以及已经连接并认证的上游。路由器 WAN 和 DNS 仍需设置。</p>
<p><strong>实验预览：此包未使用 Apple Developer ID 签名，也未经过 Apple 公证。通用安装流程尚未完成实机联网验收。</strong></p></html>
