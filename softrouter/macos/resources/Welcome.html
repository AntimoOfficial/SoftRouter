</style><header><img src="SoftRouterIcon.png" alt="SoftRouter"><div><h1>SoftRouter</h1><p>让 Mac 连接上游，让路由器分享网络。</p></div></header>
<div class="card"><strong>检查网络</strong><p>生成本地诊断报告，核对服务、出口和近期连接记录。无需管理员权限，也不会改变网络。</p></div>
<div class="card"><strong>配置共享网关</strong><p>由 AI 准备本机配置，再在应用内核对并授权安装。已有网关不会自动迁移。</p></div>
<p class="note">安装包只将应用放入「应用程序」，不会自动启用转发。配置网关需要 macOS 14+、独立以太网接口和已认证的 Wi-Fi 上游。路由器 WAN 和 DNS 仍需设置；作为网关时须关闭自身下游 Wi-Fi 的自动加入。</p>
<p class="note preview">实验预览 · 未使用 Developer ID 签名或 Apple 公证 · 通用网关尚未完成全新机器的实机联网验收。</p></html>
