</style><header><img src="SoftRouterIcon.png" alt="SoftRouter"><div><h1>SoftRouter 已安装</h1><p>打开「应用程序 → SoftRouter」。</p></div></header>
<div class="card"><b>已有网络，先做诊断</b><p>生成诊断报告即可检查当前状态。无需重新安装网关或输入管理员密码。</p></div>
<p><b>首次配置共享</b></p><ol><li>阅读部署指南，让 AI 核对本机接口并生成配置；确认上游自动加入开启、下游 Wi-Fi 自动加入关闭。</li><li>导入配置并核对，在应用内授权安装。管理员密码只在系统提示中输入。</li><li>确认服务状态后连接路由器 WAN，设置 WAN 和 DNS，用真实下游设备验证网页。</li></ol>
<p class="note">应用安装成功不代表网关已启用或下游已联网。已有部署保持原状，不自动迁移。</p></html>
